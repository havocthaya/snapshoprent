<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Join Us | RentAll</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">
    <nav class="navbar mb-5">
        <div class="container d-flex justify-content-center">
            <a class="navbar-brand m-0" href="index.html">
                <i class="fas fa-hand-holding-heart me-2"></i>LinkRent
            </a>
        </div>
    </nav>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card border-0 shadow-lg rounded-4 p-4 fade-in">
                    <div class="text-center mb-4">
                        <h2 class="fw-bold">Create Account</h2>
                        <p class="text-muted">Start your premium rental journey</p>
                    </div>
                    <form id="registerForm">
                        <div class="mb-3">
                            <label class="form-label fw-600 small">Full Name</label>
                            <input type="text" id="name" class="form-control bg-light border-0 shadow-none px-3 py-2" placeholder="John Doe" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-600 small">Email Address</label>
                            <input type="email" id="email" class="form-control bg-light border-0 shadow-none px-3 py-2" placeholder="john@example.com" required>
                        </div>
                        <div class="mb-4">
                            <label class="form-label fw-600 small">Create Password</label>
                            <input type="password" id="password" class="form-control bg-light border-0 shadow-none px-3 py-2" placeholder="••••••••" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 py-2 fw-bold mb-3">Join Marketplace</button>
                        <div class="text-center">
                            <p class="small text-muted mb-0">Already have an account? <a href="login.html" class="text-primary fw-600 text-decoration-none">Sign In</a></p>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
    
    <div id="toast-container" class="position-fixed bottom-0 end-0 p-3"></div>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
