<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sign In | RentAll</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">
    <nav class="navbar mb-5">
        <div class="container d-flex justify-content-center">
            <a class="navbar-brand m-0" href="index.html">
                <i class="fas fa-hand-holding-heart me-2"></i>LinkRent
            </a>
        </div>
    </nav>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card border-0 shadow-lg rounded-4 p-4 fade-in">
                    <div class="text-center mb-4">
                        <h2 class="fw-bold">Welcome Back!</h2>
                        <p class="text-muted">Access your premium rental gear</p>
                    </div>
                    <form id="loginForm">
                        <div class="mb-3">
                            <label class="form-label fw-600 small">Email Address</label>
                            <div class="input-group">
                                <span class="input-group-text bg-white border-end-0"><i class="fas fa-envelope text-muted"></i></span>
                                <input type="email" id="email" class="form-control border-start-0" placeholder="admin@example.com" required>
                            </div>
                        </div>
                        <div class="mb-4">
                            <div class="d-flex justify-content-between">
                                <label class="form-label fw-600 small">Password</label>
                                <a href="#" class="small text-decoration-none text-primary fw-600">Forgot?</a>
                            </div>
                            <div class="input-group">
                                <span class="input-group-text bg-white border-end-0"><i class="fas fa-lock text-muted"></i></span>
                                <input type="password" id="password" class="form-control border-start-0" placeholder="••••••••" required>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 py-2 fw-bold mb-3">Sign In Account</button>
                        <div class="text-center">
                            <p class="small text-muted mb-0">Don't have an account? <a href="register.html" class="text-primary fw-600 text-decoration-none">Create One</a></p>
                        </div>
                    </form>
                    
                    <!-- Demo Credentials Info -->
                    <div class="mt-4 p-3 bg-light rounded-3 small">
                        <p class="mb-1 text-primary fw-600"><i class="fas fa-info-circle me-1"></i> Demo Login:</p>
                        <ul class="mb-0 text-muted ps-3">
                            <li>Email: <code>admin@example.com</code></li>
                            <li>Password: <code>any password</code></li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="toast-container" class="position-fixed bottom-0 end-0 p-3"></div>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
