<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Rental Bag | RentAll</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar sticky-top">
        <div class="container">
            <a class="navbar-brand" href="index.html"><i class="fas fa-hand-holding-heart me-2"></i>LinkRent</a>
            <div id="auth-links"></div>
        </div>
    </nav>

    <div class="container py-5">
        <div class="row">
            <div class="col-lg-8">
                <div class="card border-0 shadow-lg rounded-4 p-4 fade-in">
                    <h3 class="fw-bold mb-4">Rental Bag</h3>
                    <div id="cart-items">
                        <!-- Items rendered here -->
                        <div class="text-center py-5 text-muted">
                            <i class="fas fa-shopping-basket fa-3x mb-3 opacity-25"></i>
                            <h4>Your bag is empty...</h4>
                            <a href="index.html" class="btn btn-primary mt-3">Start Browsing</a>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-lg-4 mt-4 mt-lg-0">
                <div class="card border-0 shadow-lg rounded-4 p-4 sticky-top fade-in" style="top: 100px;">
                    <h5 class="fw-bold mb-4">Booking Summary</h5>
                    <div class="d-flex justify-content-between mb-2">
                        <span class="text-muted">Subtotal</span>
                        <span id="subtotal" class="fw-600">₹0</span>
                    </div>
                    <div class="d-flex justify-content-between mb-3 pb-3 border-bottom">
                        <span class="text-muted">Security Deposit (Refundable)</span>
                        <span class="fw-600 text-success">₹1,000</span>
                    </div>
                    <div class="d-flex justify-content-between mb-4">
                        <span class="fw-bold">Total Estimated Cost</span>
                        <span id="total-cost" class="fw-700 text-primary fs-5">₹0</span>
                    </div>
                    <button class="btn btn-primary w-100 py-3 fw-bold" id="checkoutBtn">
                        <i class="fas fa-check-circle me-2"></i>Confirm Booking
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal for Order Success -->
    <div class="modal fade" id="orderModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 rounded-4 shadow">
                <div class="modal-body text-center p-5">
                    <div class="text-success mb-4">
                        <i class="fas fa-check-circle fa-5x"></i>
                    </div>
                    <h2 class="fw-bold mb-3">Booking Confirmed!</h2>
                    <p class="text-muted mb-4">Your rental order has been placed. You can track your items in "My Rentals" section.</p>
                    <button class="btn btn-primary px-5 py-2 fw-bold" onclick="window.location.href='index.html'">Great!</button>
                </div>
            </div>
        </div>
    </div>

    <div id="toast-container" class="position-fixed bottom-0 end-0 p-3"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/cart.js"></script>
</body>
</html>
