<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RentAll | Premium Rental Marketplace</title>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg sticky-top">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <i class="fas fa-hand-holding-heart me-2"></i>LinkRent
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto align-items-center">
                    <li class="nav-item"><a class="nav-link active" href="index.html">Browse</a></li>
                    <li class="nav-item">
                        <a class="nav-link position-relative" href="cart.html">
                            <i class="fas fa-calendar-alt"></i> My Rental
                            <span id="rental-count" class="badge rounded-pill bg-primary position-absolute top-0 start-100 translate-middle" style="display: none;">0</span>
                        </a>
                    </li>
                    <li id="auth-links" class="nav-item ms-lg-3">
                        <!-- Dynamic Content -->
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Hero Section -->
    <header class="hero-section text-white text-center">
        <div class="container">
            <h1 class="display-3 fw-bold mb-3">Rent Anything, Anywhere</h1>
            <p class="lead mb-4">The smartest way to access the tools, gear, and gadgets you need without the commitment of buying.</p>
            <div class="search-box mx-auto max-width-600">
                <div class="input-group input-group-lg">
                    <input type="text" id="searchInput" class="form-control" placeholder="What are you looking for? (e.g. Bike, Camera...)">
                    <button class="btn btn-primary px-4" id="searchBtn">
                        <i class="fas fa-search"></i>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- Categories -->
    <section class="container py-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="section-title">Explore Categories</h2>
            <div class="category-filters">
                <button class="btn btn-sm btn-outline-secondary active category-btn" data-category="All">All</button>
                <button class="btn btn-sm btn-outline-secondary category-btn" data-category="Bikes">Bikes</button>
                <button class="btn btn-sm btn-outline-secondary category-btn" data-category="Electronics">Electronics</button>
                <button class="btn btn-sm btn-outline-secondary category-btn" data-category="Tools">Tools</button>
                <button class="btn btn-sm btn-outline-secondary category-btn" data-category="Outdoors">Outdoors</button>
            </div>
        </div>

        <div id="product-list" class="row row-cols-1 row-cols-md-2 row-cols-lg-4 g-4">
            <!-- Products will be loaded here -->
            <div class="col-12 text-center py-5">
                <div class="spinner-border text-primary" role="status"></div>
                <p class="mt-2 text-muted">Discovering rental gear for you...</p>
            </div>
        </div>
    </section>

    <!-- Toast Container -->
    <div id="toast-container" class="position-fixed bottom-0 end-0 p-3"></div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
