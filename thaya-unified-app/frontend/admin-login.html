<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | SnapShopRent</title>
    <link rel="stylesheet" href="css/styles.css">
    <style>
        body { 
            background: #F0F2F5; 
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        .auth-card {
            background: #FFFFFF;
            padding: 48px;
            border-radius: 24px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.06);
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .auth-logo {
            text-align: center;
            margin-bottom: 32px;
        }
        .logo-main {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 2rem;
            font-weight: 800;
            color: #5D5FEF;
            margin-bottom: 8px;
        }
        .logo-main span {
            font-size: 2.2rem;
        }
        .auth-subtitle {
            font-size: 1.1rem;
            color: #64748B;
            font-weight: 500;
        }
        .form-container {
            width: 100%;
        }
        .form-group {
            margin-bottom: 24px;
        }
        .form-group label {
            display: block;
            margin-bottom: 10px;
            font-size: 0.95rem;
            font-weight: 700;
            color: #1E293B;
        }
        .form-control {
            width: 100%;
            padding: 14px 20px;
            border: 1.5px solid #E2E8F0;
            border-radius: 12px;
            font-size: 1rem;
            background: #F8FAFC;
            transition: all 0.2s;
            color: #1E293B;
        }
        .form-control:focus {
            outline: none;
            border-color: #5D5FEF;
            background: #FFFFFF;
            box-shadow: 0 0 0 4px rgba(93, 95, 239, 0.1);
        }
        .form-submit {
            width: 100%;
            padding: 16px;
            background: #5D5FEF;
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 8px;
            box-shadow: 0 4px 14px rgba(93, 95, 239, 0.3);
        }
        .form-submit:hover {
            background: #4B4DCC;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(93, 95, 239, 0.4);
        }
        .form-submit:disabled {
            background: #94A3B8;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        .admin-id-hint {
            margin-top: 32px;
            padding: 20px;
            background: #F1F5F9;
            border-radius: 16px;
            width: 100%;
            font-size: 0.9rem;
            border: 1.5px dashed #CBD5E1;
        }
        .admin-id-hint h4 {
            margin: 0 0 10px 0;
            color: #475569;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .cred-box {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .cred-item {
            display: flex;
            justify-content: space-between;
        }
        .cred-label { color: #64748B; font-weight: 500; }
        .cred-val { color: #5D5FEF; font-weight: 700; font-family: monospace; }
        
        #error-msg {
            width: 100%;
            padding: 14px;
            background: #FEF2F2;
            border: 1px solid #FEE2E2;
            border-radius: 12px;
            color: #DC2626;
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 24px;
            display: none;
            text-align: center;
        }
        .auth-footer {
            margin-top: 24px;
            font-size: 0.95rem;
            color: #64748B;
        }
        .auth-footer a {
            color: #5D5FEF;
            font-weight: 700;
            text-decoration: none;
        }
    </style>
</head>
<body>

<div class="auth-card">
    <div class="auth-logo">
        <div class="logo-main"><span>📸</span> SnapShopRent</div>
        <div class="auth-subtitle">Sign in to your account</div>
    </div>

    <div id="error-msg"></div>

    <form class="form-container" id="admin-login-form">
        <div class="form-group">
            <label>Admin ID</label>
            <input class="form-control" type="text" id="email" placeholder="you@example.com" required>
        </div>
        <div class="form-group">
            <label>Password</label>
            <input class="form-control" type="password" id="password" placeholder="••••••••" required>
        </div>
        <button type="submit" class="form-submit" id="submit-btn">Sign In</button>
    </form>

    <div class="admin-id-hint">
        <h4>🔑 Default Credentials</h4>
        <div class="cred-box">
            <div class="cred-item">
                <span class="cred-label">Admin ID</span>
                <span class="cred-val">gopi</span>
            </div>
            <div class="cred-item">
                <span class="cred-label">Password</span>
                <span class="cred-val">123456</span>
            </div>
        </div>
    </div>

    <div class="auth-footer">
        Don't have an account? <a href="index.html">Create one</a>
    </div>
</div>

<script src="js/api.js"></script>
<script>
// If already logged in as admin, go straight to dashboard
const u = getUser();
if (u && u.isAdmin) window.location.href = 'admin.html';

document.getElementById('admin-login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn   = document.getElementById('submit-btn');
    const errEl = document.getElementById('error-msg');
    btn.textContent = 'Verifying...';
    btn.disabled = true;
    errEl.style.display = 'none';

    try {
        const res  = await fetch(`${API}/users/login`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                email:    document.getElementById('email').value,
                password: document.getElementById('password').value,
            })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.message || 'Login failed');
        if (!data.isAdmin) throw new Error('Access denied. Admin privileges required.');

        localStorage.setItem('thayaToken', data.token);
        localStorage.setItem('thayaUser',  JSON.stringify({ 
            name: data.name, 
            email: data.email, 
            isAdmin: true,
            id: data._id 
        }));
        window.location.href = 'admin.html';
    } catch(err) {
        errEl.textContent    = err.message;
        errEl.style.display  = 'block';
        btn.textContent      = 'Sign In';
        btn.disabled         = false;
    }
});
</script>
</body>
</html>
