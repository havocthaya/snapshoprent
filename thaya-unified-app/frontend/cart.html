<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Cart | SnapShopRent</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
<!-- AMAZON-STYLE HEADER -->
<header class="amazon-header">
    <div class="nav-belt">
        <a href="index.html" class="nav-logo">
            <span class="icon">📸</span>
            <span>SnapShopRent<span class="in">.in</span></span>
        </a>
        <div class="nav-location">
            <span style="font-size: 1.2rem;">📍</span>
            <div>
                <span class="loc-text">Delivering to Mumbai 400001</span>
                <span class="loc-sub">Update location</span>
            </div>
        </div>
        <div class="nav-search">
            <select class="search-select"><option>All</option></select>
            <input type="text" class="search-input" placeholder="Search SnapShopRent.in">
            <button class="search-btn">🔍</button>
        </div>
        <div class="nav-actions">
            <div class="nav-item" id="nav-user-amazon">
                <span class="top">Hello, sign in</span>
                <span class="bottom">Account & Lists ▾</span>
            </div>
            <a href="cart.html" class="nav-item nav-cart" style="border-color: rgba(255,255,255,0.4);">
                <span class="cart-bag">🛒</span>
                <span class="cart-count cart-count-badge">0</span>
                <span class="bottom" style="margin-top: 10px;">Cart</span>
            </a>
        </div>
    </div>
</header>

<div class="page-header">
    <h1>🛒 My Cart</h1>
    <p>Review your shop items and rental bookings before checkout.</p>
</div>

<div class="cart-container">
    <div>
        <h2 class="cart-section-title">Cart Items</h2>
        <div id="cart-items-container"></div>
    </div>
    <div>
        <div class="summary-card">
            <h3>Order Summary</h3>
            <div class="summary-row"><span>Shop Subtotal</span><span class="amount" id="shop-subtotal">₹0</span></div>
            <div class="summary-row"><span>Rental Subtotal</span><span class="amount" id="rental-subtotal">₹0</span></div>
            <div class="summary-row total"><span>Total</span><span class="amount" id="grand-total">₹0</span></div>
            <button class="checkout-btn" id="checkout-btn" onclick="goToPayment()">💳 Proceed to Payment</button>
            <a href="index.html" style="display:block;text-align:center;margin-top:14px;font-size:.85rem;color:var(--text-muted)">← Continue Shopping</a>
        </div>
    </div>
</div>

<div id="toast-container" class="toast-container"></div>
<script src="js/api.js"></script>
<script>
function renderCart() {
    const cart = getCart();
    const container = document.getElementById('cart-items-container');
    const btn = document.getElementById('checkout-btn');

    if (!cart.length) {
        container.innerHTML = `<div class="cart-empty"><div class="empty-icon">🛒</div><p>Your cart is empty</p><a href="index.html" class="btn btn-primary">Start Shopping</a></div>`;
        btn.disabled = true;
        updateSummary([]);
        return;
    }

    btn.disabled = false;
    container.innerHTML = cart.map((item, idx) => {
        const total = item.type === 'rental' ? item.pricePerDay * item.days * item.qty : item.price * item.qty;
        const priceLabel = item.type === 'rental'
            ? `₹${item.pricePerDay?.toLocaleString()}/day × ${item.days} day${item.days>1?'s':''} × ${item.qty}`
            : `₹${item.price?.toLocaleString()} × ${item.qty}`;
        return `
        <div class="cart-item">
            <img class="cart-item-img" src="${item.image}" alt="${item.name}" onerror="this.src='https://via.placeholder.com/80'">
            <div class="cart-item-info">
                <span class="item-type-badge ${item.type}">${item.type === 'sale' ? '🛍 Buy' : '🔑 Rent'}</span>
                <h4>${item.name}</h4>
                <div class="item-meta">${priceLabel}</div>
            </div>
            <div style="display:flex;align-items:center;gap:10px;flex-direction:column;align-items:flex-end">
                <span class="cart-item-price">₹${total.toLocaleString()}</span>
                <div style="display:flex;align-items:center;gap:6px">
                    <button onclick="changeQty(${idx}, -1)" style="width:28px;height:28px;border-radius:6px;border:1.5px solid var(--border);background:var(--bg);cursor:pointer;font-size:.9rem">−</button>
                    <span style="font-weight:700;min-width:20px;text-align:center">${item.qty}</span>
                    <button onclick="changeQty(${idx}, 1)"  style="width:28px;height:28px;border-radius:6px;border:1.5px solid var(--border);background:var(--bg);cursor:pointer;font-size:.9rem">+</button>
                    <button class="btn-remove" onclick="removeItem(${idx})" title="Remove">✕</button>
                </div>
            </div>
        </div>`;
    }).join('');

    updateSummary(cart);
}

function updateSummary(cart) {
    let shopSub = 0, rentalSub = 0;
    cart.forEach(i => {
        if (i.type === 'sale') shopSub += i.price * i.qty;
        else rentalSub += i.pricePerDay * i.days * i.qty;
    });
    document.getElementById('shop-subtotal').textContent   = `₹${shopSub.toLocaleString()}`;
    document.getElementById('rental-subtotal').textContent = `₹${rentalSub.toLocaleString()}`;
    document.getElementById('grand-total').textContent     = `₹${(shopSub + rentalSub).toLocaleString()}`;
}

function removeItem(idx) {
    const cart = getCart();
    const name = cart[idx].name;
    cart.splice(idx, 1);
    saveCart(cart);
    renderCart();
    showToast(`"${name}" removed.`, 'info');
}

function changeQty(idx, delta) {
    const cart = getCart();
    cart[idx].qty = Math.max(1, cart[idx].qty + delta);
    saveCart(cart);
    renderCart();
}

function goToPayment() {
    if (!getUser()) {
        showToast('Please log in to checkout.', 'error');
        setTimeout(() => window.location.href = 'login.html', 1400);
        return;
    }
    // Pass cart to payment page via sessionStorage
    sessionStorage.setItem('pendingOrder', JSON.stringify({ cart: getCart() }));
    window.location.href = 'payment.html';
}

document.addEventListener('DOMContentLoaded', () => { renderCart(); renderNavbar(); });
</script>
</body>
</html>
