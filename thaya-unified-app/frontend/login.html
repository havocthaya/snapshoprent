<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | SnapShopRent</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="auth-container">
    <div class="auth-card">
        <div class="auth-logo">
            <div class="logo-text">📸 SnapShopRent</div>
            <p>Sign in to your account</p>
        </div>
        <div id="error-msg" style="display:none;background:#ffe8e8;border:1px solid #ffb3b3;padding:10px 14px;border-radius:10px;color:#cc0000;font-size:.85rem;margin-bottom:16px;"></div>
        <form id="login-form">
            <div class="form-group">
                <label>Email Address</label>
                <input class="form-control" type="email" id="email" placeholder="you@example.com" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input class="form-control" type="password" id="password" placeholder="••••••••" required>
            </div>
            <button type="submit" class="form-submit" id="submit-btn">Sign In</button>
        </form>
        <div class="auth-footer">
            Don't have an account? <a href="register.html">Create one</a>
        </div>
    </div>
</div>
<script src="js/api.js"></script>
<script>
document.getElementById('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('submit-btn');
    const errEl = document.getElementById('error-msg');
    btn.textContent = 'Signing in…';
    btn.disabled = true;
    errEl.style.display = 'none';

    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;

    try {
        const res = await fetch(`${API}/users/login`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.message || 'Login failed');
        localStorage.setItem('thayaToken', data.token);
        localStorage.setItem('thayaUser', JSON.stringify({ name: data.name, email: data.email, isAdmin: data.isAdmin }));
        window.location.href = 'index.html';
    } catch(err) {
        errEl.textContent = err.message;
        errEl.style.display = 'block';
        btn.textContent = 'Sign In';
        btn.disabled = false;
    }
});
</script>
</body>
</html>
