<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart - MiniShop</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="d-flex flex-column min-vh-100">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <i class="fas fa-shopping-bag text-primary me-2"></i>MiniShop
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto align-items-center">
                    <li class="nav-item me-3">
                        <a class="nav-link position-relative active" href="cart.html">
                            <i class="fas fa-shopping-cart fs-5"></i>
                            <span id="cart-count" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger" style="display:none;font-size: 0.65rem;">0</span>
                        </a>
                    </li>
                    <div id="auth-links" class="d-flex align-items-center mb-0 list-unstyled m-0 p-0"></div>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="container py-5 flex-grow-1">
        <h2 class="fw-bold mb-4">Shopping Cart</h2>
        
        <div class="row">
            <div class="col-lg-8" id="cart-items-container">
                <!-- Cart items will be rendered here -->
            </div>
            <div class="col-lg-5" id="cart-summary" style="display:none;">
                <div class="summary-card p-4 mb-4">
                    <h5 class="fw-bold mb-3"><i class="fas fa-truck text-primary me-2"></i>Shipping Details</h5>
                    <form id="checkout-form">
                        <div class="mb-3">
                            <label class="form-label small text-muted">Full Address</label>
                            <input type="text" class="form-control" id="ship-address" required placeholder="123 Main St">
                        </div>
                        <div class="row">
                            <div class="col-6 mb-3">
                                <label class="form-label small text-muted">City</label>
                                <input type="text" class="form-control" id="ship-city" required placeholder="New York">
                            </div>
                            <div class="col-6 mb-3">
                                <label class="form-label small text-muted">Postal Code</label>
                                <input type="text" class="form-control" id="ship-postal" required placeholder="10001">
                            </div>
                        </div>
                        <div class="mb-4">
                            <label class="form-label small text-muted">Country</label>
                            <input type="text" class="form-control" id="ship-country" required placeholder="USA">
                        </div>

                        <h5 class="fw-bold mb-3 mt-4"><i class="fas fa-credit-card text-primary me-2"></i>Payment Method</h5>
                        
                        <label class="payment-option d-flex align-items-center mb-3 w-100" for="pay-online">
                            <input class="form-check-input me-3 mt-0" type="radio" name="paymentMethod" id="pay-online" value="Online Payment" checked>
                            <div class="option-content flex-grow-1">
                                <span class="d-block fw-bold">Online Payment</span>
                                <span class="small text-muted">Pay securely with Credit Card/UPI</span>
                            </div>
                            <i class="fas fa-shield-alt text-success ms-auto fs-5"></i>
                        </label>
                        
                        <label class="payment-option d-flex align-items-center mb-4 w-100" for="pay-cod">
                            <input class="form-check-input me-3 mt-0" type="radio" name="paymentMethod" id="pay-cod" value="Cash On Delivery">
                            <div class="option-content flex-grow-1">
                                <span class="d-block fw-bold">Cash On Delivery</span>
                                <span class="small text-muted">Pay when you receive the order</span>
                            </div>
                            <i class="fas fa-money-bill-wave text-success ms-auto fs-5"></i>
                        </label>

                        <hr class="my-4">
                        <div class="d-flex justify-content-between mb-2">
                            <span class="text-muted">Subtotal (<span id="summary-qty">0</span> items)</span>
                            <span class="fw-bold fs-5">₹<span id="summary-price">0</span></span>
                        </div>
                        
                        <div id="order-error" class="alert alert-danger" style="display:none;"></div>
                        <button type="submit" id="checkout-btn" class="btn btn-primary w-100 mt-3 py-3 fs-5">Place Order</button>
                        <p id="auth-warning" class="text-danger small mt-2 text-center" style="display:none;">You must be logged in to place an order.</p>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <div id="toast-container" class="position-fixed bottom-0 end-0 p-3 toast-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/cart.js"></script>
</body>
</html>
