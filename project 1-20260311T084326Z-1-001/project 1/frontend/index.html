<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiniShop - E-Commerce</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <i class="fas fa-shopping-bag text-primary me-2"></i>MiniShop
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto align-items-center">
                    <li class="nav-item me-3">
                        <a class="nav-link position-relative" href="cart.html">
                            <i class="fas fa-shopping-cart fs-5"></i>
                            <span id="cart-count" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger" style="display:none;font-size: 0.65rem;">0</span>
                        </a>
                    </li>
                    <div id="auth-links" class="d-flex align-items-center mb-0 list-unstyled m-0 p-0">
                        <!-- Rendered by api.js updateNav() -->
                    </div>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="container py-4">
        <!-- Hero Section -->
        <div class="hero-section mb-5 shadow-sm">
            <div class="row align-items-center hero-content">
                <div class="col-lg-6">
                    <span class="badge bg-primary px-3 py-2 rounded-pill mb-3">Premium Quality</span>
                    <h1 class="hero-title">Elevate Your Lifestyle.</h1>
                    <p class="lead text-muted mb-4 fs-5">Discover our curated collection of high-end electronics and premium gear.</p>
                    <a href="#products-grid" class="btn btn-primary btn-lg px-4 py-3 rounded-pill">Shop Now <i class="fas fa-arrow-right ms-2"></i></a>
                </div>
                <div class="col-lg-6 d-none d-lg-block text-center">
                    <img src="https://images.unsplash.com/photo-1607082348824-0a96f2a4b9da?ixlib=rb-4.0.3&auto=format&fit=crop&w=600&q=80" alt="Shopping" class="img-fluid rounded-4 shadow-lg" style="transform: rotate(-3deg);">
                </div>
            </div>
        </div>

        <div class="d-flex justify-content-between align-items-center mb-4 mt-5">
            <h2 class="fw-bold text-gradient">Featured Products</h2>
        </div>
        
        <!-- Loading Spinner -->
        <div id="loader" class="text-center my-5" style="display:none;">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
        </div>

        <!-- Error Message -->
        <div id="error-message" class="alert alert-danger" style="display:none;"></div>

        <!-- Product Grid -->
        <div id="products-grid" class="row g-4 list-unstyled">
            <!-- Rendered by app.js -->
        </div>
    </main>

    <!-- Toast Container -->
    <div id="toast-container" class="position-fixed bottom-0 end-0 p-3 toast-container"></div>

    <!-- Bootstrap Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Custom Scripts -->
    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
